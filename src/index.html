<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Which company will Bending Spoons buy next? Pick a company in four duels. Bend its spoon. See the crowd's Elo ranking.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Get Bent">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Get Bent. Who will Bending Spoons buy next?">
  <meta property="og:description" content="Four duels. You pick who gets bent. The crowd ranks the next acquisition.">
  <meta property="og:url" content="https://keff.uk/bending/">
  <meta property="og:image" content="https://keff.uk/bending/social.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://keff.uk/bending/">
  <link rel="manifest" href="/bending/manifest.webmanifest">
  <link rel="icon" href="/bending/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/bending/icon-192.png">
  <script src="/bending/theme.js"></script>
  <link rel="stylesheet" href="/bending/style.css">
  <title>Get Bent. Who will Bending Spoons buy next?</title>
</head>
<body>
  <a class="skip" href="#main">Skip to game</a>
  <div class="app">
    <header class="header">
      <a class="wordmark" href="/bending/" aria-label="Get Bent home">GET BENT<span class="wordmark-dot">.</span></a>
      <div class="header-actions">
        <button id="install" class="quiet" hidden>Install</button>
        <button id="theme" class="icon-button" aria-label="Switch to dark mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.8 8.8 0 0 1 9.5 3.5a8.8 8.8 0 1 0 11 11Z"/></svg>
        </button>
        <button id="sound" class="icon-button" aria-label="Turn sound on" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6m0-6-5 6"/></svg>
        </button>
      </div>
    </header>
    <p id="install-help" class="install-help" hidden>In Safari, tap Share, then Add to Home Screen.</p>
    <main id="main" tabindex="-1"></main>
    <footer class="footer"><a href="https://keff.uk/">k_eff</a><a href="https://github.com/kennethassogba/bending" aria-label="Get Bent source on GitHub">Source</a></footer>
  </div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><p>This game needs JavaScript to record your votes.</p></noscript>
  <script type="module" src="/bending/app.js"></script>
</body>
</html>
